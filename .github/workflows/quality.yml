name: Quality

on:
  push:
    branches: [main, 'chore/**', 'feature/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and deterministic verify
        run: npm run check && npm run verify
      - name: Test release and rerun rules without publishing
        run: node --test tests/release_pipeline.test.cjs tests/watch_analytics.test.cjs tests/state_store.test.cjs tests/integration_diagnostics.test.cjs tests/discover_policy.test.cjs tests/retention_policy.test.cjs
      - name: Verify bundle matches sources
        run: git diff --exit-code -- yourtube.user.js yourtube.meta.js

  guide-overlay:
    name: Chromium guide regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only driver
        run: |
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/guide-venv"
          "$RUNNER_TEMP/guide-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tests/requirements-guide-ci.txt
      - name: Locate Chrome on the runner
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Guide, palette and feature interactions
        run: |
          "$RUNNER_TEMP/guide-venv/bin/python" tests/guide_overlay.py --browser "$CHROME_BIN"
          "$RUNNER_TEMP/guide-venv/bin/python" tests/guide_all_themes.py --browser "$CHROME_BIN"
          "$RUNNER_TEMP/guide-venv/bin/python" tests/feature_effects.py --browser "$CHROME_BIN"
      - name: Watch-session playback and persistence
        id: sessions
        run: '"$RUNNER_TEMP/guide-venv/bin/python" tests/watch_sessions.py --browser "$CHROME_BIN" --out "$RUNNER_TEMP/watch-results"'
      - name: Retain browser observations and captures
        if: ${{ !cancelled() && (steps.sessions.outcome == 'success' || steps.sessions.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-session-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watch-results
          if-no-files-found: error
          retention-days: 7
      - name: Journal dashboard navigation and migration
        id: dashboard
        run: '"$RUNNER_TEMP/guide-venv/bin/python" tests/journal_dashboard.py --browser "$CHROME_BIN" --out "$RUNNER_TEMP/journal-dashboard"'
      - name: Retain journal dashboard observations and captures
        if: ${{ !cancelled() && (steps.dashboard.outcome == 'success' || steps.dashboard.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-dashboard-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journal-dashboard
          if-no-files-found: error
          retention-days: 7

  runtime-controls:
    name: Dashboard runtime effect contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned browser driver
        run: |
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/runtime-venv"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r tests/requirements-guide-ci.txt
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Exercise all registered feature scenarios
        run: '"$RUNNER_TEMP/runtime-venv/bin/python" tests/live_controls/features.py --browser "$CHROME_BIN" --workers 2 --out "$RUNNER_TEMP/runtime-features"'
      - name: Exercise dashboard and player contracts
        run: '"$RUNNER_TEMP/runtime-venv/bin/python" tests/live_controls/workbench.py --browser "$CHROME_BIN" --out "$RUNNER_TEMP/runtime-contracts"'
      - name: Retain offline measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-controls-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-features
            ${{ runner.temp }}/runtime-contracts
          if-no-files-found: warn
          retention-days: 7
