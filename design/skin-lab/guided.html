<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourTube · Guided setup</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f9f9f9;color:#111;font:16px/1.5 Roboto,Arial,sans-serif}html[dark] body{background:#0f0f0f;color:#eee}.labhead{padding:14px 22px;border-bottom:1px solid #8885;display:flex;align-items:center;gap:12px}.labmark{background:#f03;color:white;border-radius:8px;padding:1px 9px}.labhead button,.launch{font:inherit;border:1px solid #8886;color:inherit;background:none;border-radius:24px;padding:7px 15px;cursor:pointer}.labhead button{margin-left:auto}.stage{padding:clamp(20px,6vw,90px);max-width:620px}.stage h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.06em;line-height:1.05}.stage small{letter-spacing:.12em}.launch{background:#065fd4;color:white;border:0}</style>
<header class="labhead"><b><span class="labmark">▶</span> YourTube</b> <small>Design preview</small><button id="theme">Switch appearance</button></header><ytd-app><section class="stage"><small>GUIDED SETUP / 04</small><h1>Make YouTube yours.</h1><p>This preview runs the assembled userscript on a local fixture. Changes persist in this preview browser, not on youtube.com.</p><button class="launch" onclick="YourTube.openDashboard()">Open settings</button></section></ytd-app>
<script>const setMode=d=>document.documentElement.toggleAttribute('dark',d);setMode(matchMedia('(prefers-color-scheme:dark)').matches);theme.onclick=()=>setMode(!document.documentElement.hasAttribute('dark'));if(!localStorage.getItem('yourtube.cfg'))localStorage.setItem('yourtube.cfg',JSON.stringify({safeMode:true,privacyPreset:'maximum',sessionRestoreOn:false,autoHD:false,updateCheckOn:false,sponsorblockOn:false,deArrowOn:false}));</script><script src="bundle.js"></script><script>addEventListener('yourtube:applied',()=>{YourTube.openDashboard();document.querySelector('.ytg-invite')?.click()},{once:true})</script></html>
