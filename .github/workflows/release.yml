name: Stable release

on:
  push:
    # GitHub filter patterns, not a regex. RC tags build artifacts but do not publish.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    uses: ./.github/workflows/quality.yml
  release:
    name: Publish verified stable assets
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and publish both assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-stable.sh
