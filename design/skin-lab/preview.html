<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live dashboard concept</title>
<style>html,body{margin:0;background:#111;color:#eee;color-scheme:dark}#reopen{padding:1em}</style><button id="reopen" onclick="openSkin()">Reopen dashboard</button><script src="skins.js"></script><script>
const i=Math.max(0,Math.min(19,Number(new URLSearchParams(location.search).get('id'))-1||0));const [name,paper,accent,description,rules]=skins[i];localStorage.setItem('yourtube.cfg',JSON.stringify({safeMode:true,privacyPreset:'maximum',updateCheckOn:false,deArrowOn:false,sponsorblockOn:false,sessionRestoreOn:false,autoHD:true,qualityPref:'hd720',dashCat:'playback',silentToasts:true}));
function openSkin(){YourTube.openDashboard(); const d=document.querySelector('.ytb-dash');if(!d)return;d.querySelector('h1').textContent=name; d.querySelector('.yj-brand span:last-child').textContent='SKIN LAB / '+String(i+1).padStart(2,'0');d.querySelector('.ytb-dver').textContent='DESIGN PREVIEW';if(!document.querySelector('#concept')){let st=document.createElement('style');st.id='concept';st.textContent=`.ytb-dash[data-skin=journal]{--j-paper:${paper};--j-field:color-mix(in srgb,${paper},white 6%);--j-tint:color-mix(in srgb,${paper},black 14%);--j-wash:color-mix(in srgb,${paper},${accent} 16%);--j-ink:#f5f1ed;--j-heading:#f3f2ef;--j-muted:#c0c1bf;--j-green:${accent};--j-rule:color-mix(in srgb,${paper},${accent} 33%);--j-field-rule:var(--j-rule);--j-hair:color-mix(in srgb,${paper},white 15%);--j-fill:${accent};--j-danger:#ffaba7;--j-focus:${accent};inset:0!important;transform:none!important;width:100%!important;height:100%!important;max-width:none;max-height:none;border-radius:0;color-scheme:dark}.ytb-dash :is(button,input,select,textarea){color-scheme:dark}.ytb-dash .ytb-nav-item[aria-current=true] .ytb-nav-count{color:#232323}.ytb-dash .ytb-knob{background:#bdbfba}.ytb-dash .ytb-foot{border-bottom:3px solid var(--j-green)}@scope (.ytb-dash[data-skin=journal]){${rules.replaceAll(/([^{}]+)\{/g,(m,sel)=>sel.split(',').map(x=>`:scope ${x.trim()}`).join(',')+'{')}}`;document.head.append(st)}}
</script><script src="bundle.js"></script><script>addEventListener('yourtube:applied',()=>{if(!document.querySelector('#concept'))openSkin()},{once:true}); if(window.YourTube)openSkin();</script>
