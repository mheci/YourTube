name: Channel health

# Weekly audit of the userscript update channel:
#   - releases/latest must serve the stable tag, tagged package.json and both
#     complete artifact header versions (never a truncated RC version);
#   - rebuilding the artifact at the tagged commit must reproduce the released
#     yourtube.user.js byte-for-byte (deterministic pipeline);
#   - both /releases/latest/download URLs must answer HTTP 200.
# Any failure opens or updates one tracking issue (label: channel-drift);
# a healthy run closes it again. This workflow never pushes commits.

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-health
  cancel-in-progress: false

jobs:
  audit:
    name: Audit update channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve latest release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag" >&2; exit 1
          fi
          echo "Latest published release: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.rel.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Audit channel
        id: audit
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -u
          : > diagnostics.txt
          : > channel-log.txt
          fail=0
          note() { printf '%s\n' "$1" >> channel-log.txt; }
          failnote() { printf '%s\n' "$1" >> channel-log.txt; printf '%s\n' "$1" >> diagnostics.txt; fail=1; }
          check() { if [ "$2" = "$3" ]; then note "PASS: $1 ($2)"; else failnote "FAIL: $1 (expected $3, got $2)"; fi; }

          tag="$RELEASE_TAG"
          expected="${tag#v}"

          pkg_version="$(node -p 'require("./package.json").version')"
          check "package.json version matches latest release tag" "$pkg_version" "$expected"

          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"

          code_meta="$(curl -sS -L -o meta.released.js -w '%{http_code}' "${base}/yourtube.meta.js")"
          check "GET ${base}/yourtube.meta.js" "$code_meta" "200"
          code_user="$(curl -sS -L -o user.released.js -w '%{http_code}' "${base}/yourtube.user.js")"
          check "GET ${base}/yourtube.user.js" "$code_user" "200"

          header_version() { awk '$1=="//" && $2=="@version" {sub(/\r$/, "", $3); print $3; exit}' "$1"; }
          if [ "$code_meta" = "200" ]; then
            check "released meta.js @version matches latest release tag" "$(header_version meta.released.js)" "$expected"
          fi
          if [ "$code_user" = "200" ]; then
            check "released user.js @version matches latest release tag" "$(header_version user.released.js)" "$expected"
          fi

          npm ci --no-audit --no-fund || failnote "FAIL: lockfile install"
          node scripts/build-userscript.js || failnote "FAIL: tagged source did not rebuild"

          if [ "$code_user" = "200" ]; then
            sha_built="$(sha256sum yourtube.user.js | cut -d' ' -f1)"
            sha_rel="$(sha256sum user.released.js | cut -d' ' -f1)"
            if [ "$sha_built" = "$sha_rel" ]; then
              note "PASS: rebuilt artifact SHA256 matches released asset (${sha_built})"
            else
              failnote "FAIL: rebuilt artifact SHA256 ${sha_built} != released ${sha_rel}"
            fi
            sha_meta_built="$(sha256sum yourtube.meta.js | cut -d' ' -f1)"
            sha_meta_rel="$(sha256sum meta.released.js | cut -d' ' -f1)"
            if [ "$sha_meta_built" = "$sha_meta_rel" ]; then
              note "PASS: rebuilt meta.js SHA256 matches released asset"
            else
              failnote "FAIL: rebuilt meta.js SHA256 ${sha_meta_built} != released ${sha_meta_rel}"
            fi
          else
            failnote "SKIP: artifact comparison impossible (release assets unreachable)"
          fi

          if [ "$fail" -eq 0 ]; then
            note "RESULT: channel healthy at $(date -u '+%Y-%m-%dT%H:%M:%SZ') for release ${tag}"
          else
            failnote "RESULT: channel drift detected at $(date -u '+%Y-%m-%dT%H:%M:%SZ') for release ${tag} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi

          cat channel-log.txt
          rm -f meta.released.js user.released.js
          exit "$fail"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ] && [ ! -s diagnostics.txt ]; then
            echo "Channel audit did not produce diagnostics; leaving any open issue untouched." >&2
            exit 1
          fi
          if [ -s diagnostics.txt ]; then
            {
              echo "Automated channel audit failed."
              echo ""
              printf '%s\n' "- Release under audit: $RELEASE_TAG"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- Detected: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo ''
              echo '```'
              cat channel-log.txt 2>/dev/null || true
              echo '```'
            } > body.md
            gh label create channel-drift --color D97706 --description "Automated update-channel drift reports" 2>/dev/null || true
            number="$(gh issue list --label channel-drift --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              gh issue create --title "channel-drift: update channel verification failed" --label channel-drift --body-file body.md
            else
              gh issue edit "$number" --body-file body.md
            fi
            exit 1
          fi
          number="$(gh issue list --label channel-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Channel verified healthy by automated audit at $(date -u '+%Y-%m-%dT%H:%M:%SZ'). Closing."
          fi
